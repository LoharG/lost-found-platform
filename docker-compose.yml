# Local development stack.
#   docker compose up -d --build
# App: http://localhost:${APP_HOST_PORT:-3000} (Caddy -> web + /api, like the
# production ingress)   Mail inbox: http://localhost:8025
# Host ports are configurable, e.g. API_HOST_PORT=5001 if macOS AirPlay holds 5000.

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-production}
  APP_URL: ${APP_URL:-http://localhost:3000}
  DB_HOST: db
  DB_PORT: 5432
  DB_USER: postgres
  DB_PASSWORD: ${DB_PASSWORD:-admin}
  DB_NAME: lost_found_db
  SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env (openssl rand -hex 32)}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
  APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
  APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
  APPLE_KEY_ID: ${APPLE_KEY_ID:-}
  APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  MAIL_FROM: ${MAIL_FROM:-Lost & Found <no-reply@lostfound.local>}
  STORAGE_DRIVER: local
  STORAGE_LOCAL_DIR: /app/storage
  LEGACY_UPLOADS_DIR: /app/uploads
  ENABLE_TEST_AUTH: ${ENABLE_TEST_AUTH:-}
  RATE_LIMIT_MULTIPLIER: ${RATE_LIMIT_MULTIPLIER:-1}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: lost_found_db
    ports:
      - "${DB_HOST_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lost_found_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAIL_UI_HOST_PORT:-8025}:8025"

  migrate:
    build: ./backend
    command: ["node", "server.js", "migrate"]
    environment: *api-env
    volumes:
      - storage:/app/storage
      - uploads:/app/uploads:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    environment: *api-env
    ports:
      - "${API_HOST_PORT:-5000}:5000"
    volumes:
      - storage:/app/storage
      - uploads:/app/uploads:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://backend:5000
    environment:
      API_INTERNAL_URL: http://backend:5000
      APP_URL: ${APP_URL:-http://localhost:3000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: caddy:2.10-alpine
    ports:
      - "${APP_HOST_PORT:-3000}:80"
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:   # prototype uploads (read-only; converted by the migrate job)
  storage:   # processed images
